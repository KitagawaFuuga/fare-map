name: CI

on:
  push:
  pull_request:

# GITHUB_TOKEN は読み取りだけにする。部品（uses:）は書き換えられないようコミットハッシュで固定し、
# 後ろのコメントのバージョンは Dependabot がハッシュと一緒に更新する（docs/decisions/0006）
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run test

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # 本番ビルドを起動してブラウザから触る。ビルドも typecheck も通るのに
      # 地図が白いままになる類の不具合（maplibre のワーカー 404）はここでしか出ない。
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: e2e-results
          path: test-results/
          retention-days: 7
