name: CI

on:
  push:
  pull_request:

# GITHUB_TOKEN は読み取りだけにする。部品（uses:）は書き換えられないようコミットハッシュで固定し、
# 後ろのコメントのバージョンは Dependabot がハッシュと一緒に更新する（docs/decisions/0006）
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run test

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # 本番ビルドを起動してブラウザから触る。ビルドも typecheck も通るのに
      # 地図が白いままになる類の不具合（maplibre のワーカー 404）はここでしか出ない。
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: e2e-results
          path: test-results/
          retention-days: 7

  # 表示速度を PR ごとに測る。CI の計測はぶれるので、基準を外れても警告だけで止めない
  # （必須のチェックにもしない）。結果はジョブの要約欄の表と、artifact のレポートで見る
  lighthouse:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run lighthouse
        env:
          RATE_LIMIT_CAPACITY: "1000"
      - name: Summary
        if: always()
        run: npx tsx scripts/analysis/lighthouse-summary.ts >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: lighthouse-reports
          path: .lighthouseci/reports/
          retention-days: 14
