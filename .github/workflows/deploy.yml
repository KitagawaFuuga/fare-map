name: Deploy to Azure Container Apps

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".claude/**"
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  # 途中で止めると、流れを固定したまま・確認中の版が動いたまま、という状態が
  # 残りうる。後から来た実行は待たせて、前の実行を最後まで走らせる。
  cancel-in-progress: false

# GITHUB_TOKEN は読み取りだけにする。Docker Hub と Azure へは Secrets の認証情報で入るので、
# トークンの書き込み権限は要らない。部品はコミットハッシュで固定する（docs/decisions/0006）
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run test

  # CI と同じ E2E。デプロイを止める位置に置く（docs/decisions/0002-e2e-before-deploy.md）
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # apt のミラーが一時的に 404 を返して落ちることがある（2026-11-26、PR #30 の e2e）。
      # コードと関係ない失敗なので、間を空けて3回まで試す
      - name: Install Playwright browser
        run: |
          for i in 1 2 3; do
            npx playwright install --with-deps chromium && exit 0
            echo "::warning::playwright install が失敗（$i 回目）。30 秒後に試し直す"
            sleep 30
          done
          exit 1
      - run: npm run e2e
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: e2e-results
          path: test-results/
          retention-days: 7

  deploy:
    needs: [test, e2e]
    # workflow_dispatch はどのブランチでも実行できる。main 以外を本番に出さない
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # 本番前の確認（Verify candidate）で使う。時間のかかる準備は、流れを固定する前に済ませる
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # apt のミラーが一時的に 404 を返して落ちることがある（2026-11-26、PR #30 の e2e）。
      # コードと関係ない失敗なので、間を空けて3回まで試す
      - name: Install Playwright browser
        run: |
          for i in 1 2 3; do
            npx playwright install --with-deps chromium && exit 0
            echo "::warning::playwright install が失敗（$i 回目）。30 秒後に試し直す"
            sleep 30
          done
          exit 1

      - name: Set image tag (commit SHA)
        id: meta
        run: echo "tag=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to Docker Hub
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # いったんローカルに読み込むだけにして、動作確認が通ってから push する。
      # イメージが起動しないまま latest が更新されるのを防ぐ。
      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          load: true
          tags: fare-map:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # コンテナを実際に起動して API を叩く。ここは next start ではなく本番と同じ
      # standalone サーバー(node server.js)が動く。Dockerfile の COPY 漏れや
      # 起動時クラッシュは、ビルドが成功しても起動して初めて表面化する
      # （data/fare-overrides の COPY 漏れで実際に起きた）。
      - name: Smoke test the image
        run: |
          docker run -d --name fare-map-ci -p 3000:3000 fare-map:ci
          for i in $(seq 1 30); do
            if curl -fsS "http://127.0.0.1:3000/api/stations?q=%E6%96%B0%E5%AE%BF" -o /tmp/stations.json; then
              break
            fi
            sleep 2
          done
          if ! test -s /tmp/stations.json; then
            echo "::error::コンテナが応答しませんでした"
            docker logs fare-map-ci
            exit 1
          fi
          node -e '
            const b = require("/tmp/stations.json");
            if (!Array.isArray(b.stations) || b.stations.length === 0) {
              console.error("駅が返らなかった:", JSON.stringify(b).slice(0, 300));
              process.exit(1);
            }
            console.log("OK:", b.stations.length, "件");
          '
          docker rm -f fare-map-ci

      - name: Push image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          # latest は本番に切り替えたあとで付ける（Tag latest）
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/fare-map:${{ steps.meta.outputs.tag }}
          cache-from: type=gha

      - name: Login to Azure
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # ここから下は、新しい版を利用者に流さずに起動して確かめ、通ったときだけ
      # 切り替える（docs/decisions/0003-verify-before-traffic.md）。
      # 失敗したら利用者は今の版のまま、新しい版は止めて終わる。

      # 複数の版を同時に動かせるモードにし、今の版に流れを固定する。固定しないと
      # 新しい版を作った時点で 100% がそちらへ流れる。2回目以降は何も変わらない。
      - name: Pin traffic to the serving revision
        id: pin
        run: |
          A="--name fare-map --resource-group fare-map-rg"
          az containerapp revision set-mode $A --mode multiple -o none
          SERVING=$(az containerapp revision list $A \
            --query "[?properties.trafficWeight > \`0\`].name" -o tsv)
          # 流れが複数の版に分かれていたら、どれを残すか機械では決められないので止める
          if [ "$(echo "$SERVING" | grep -c .)" -ne 1 ]; then
            echo "::error::流れを受けている版が1つではない: $(echo $SERVING)"
            exit 1
          fi
          CUR="$SERVING"
          az containerapp ingress traffic set $A --revision-weight "$CUR=100" -o none
          # 単一モードの「最新の版に流す」設定が残っていると、新しい版を作った
          # 時点でそちらに流れる。残っていないことを確かめてから先へ進む
          LATEST=$(az containerapp ingress traffic show $A \
            --query "length([?latestRevision && weight > \`0\`])" -o tsv)
          if [ "$LATEST" != "0" ]; then
            echo "::error::最新の版へ流す設定が残っている"
            exit 1
          fi
          echo "current=$CUR" >> "$GITHUB_OUTPUT"

      # 版の名前は英小文字で始める必要があり、SHA は数字で始まりうるので v を前に付ける。
      # 再実行で同じ名前にならないよう、実行番号と試行回数も入れる。
      - name: Create candidate revision
        id: candidate
        run: |
          A="--name fare-map --resource-group fare-map-rg"
          SUFFIX="v${{ github.run_number }}-${{ github.run_attempt }}-${{ steps.meta.outputs.tag }}"
          az containerapp update $A \
            --image ${{ secrets.DOCKERHUB_USERNAME }}/fare-map:${{ steps.meta.outputs.tag }} \
            --revision-suffix "$SUFFIX" -o none
          NEW="fare-map--$SUFFIX"
          echo "name=$NEW" >> "$GITHUB_OUTPUT"
          # ラベルを付けた版には、本番とは別の専用 URL で届く
          az containerapp revision label add $A --label candidate --revision "$NEW" --yes -o none
          FQDN=$(az containerapp show $A --query properties.configuration.ingress.fqdn -o tsv)
          echo "url=https://fare-map---candidate.${FQDN#fare-map.}" >> "$GITHUB_OUTPUT"

      # 0台から起動する直後は遅く、E2E がタイムアウトする。駅の候補が返るまで待つ
      # （返るなら graph.json の読み込みまで済んでいる）。1回の要求にも上限を付け、
      # 応答しないまま固まって全体の待ち時間を超えないようにする。
      - name: Wait for candidate
        run: |
          for i in $(seq 1 36); do
            if curl -fsS --max-time 10 "${{ steps.candidate.outputs.url }}/api/stations?q=%E6%96%B0%E5%AE%BF" -o /tmp/candidate.json; then
              break
            fi
            sleep 5
          done
          if ! test -s /tmp/candidate.json; then
            echo "::error::新しい版が応答しなかった"
            exit 1
          fi
          node -e '
            const b = require("/tmp/candidate.json");
            if (!Array.isArray(b.stations) || b.stations.length === 0) {
              console.error("駅が返らなかった:", JSON.stringify(b).slice(0, 300));
              process.exit(1);
            }
            console.log("応答あり:", b.stations.length, "件");
          '

      - name: Verify candidate
        env:
          E2E_BASE_URL: ${{ steps.candidate.outputs.url }}
        run: npx playwright test --grep @prod --project chromium

      - name: Promote candidate
        run: |
          az containerapp ingress traffic set --name fare-map --resource-group fare-map-rg \
            --revision-weight "${{ steps.candidate.outputs.name }}=100" "${{ steps.pin.outputs.current }}=0" -o none
          echo "本番を ${{ steps.candidate.outputs.name }} に切り替えた"

      # 前の版を止める。切り替えの直後に止めると処理中の検索が落ちるので、少し待つ。
      # 失敗しても本番の流れには影響しないので、警告だけにする
      - name: Deactivate previous revision
        continue-on-error: true
        run: |
          sleep 30
          az containerapp revision deactivate --name fare-map --resource-group fare-map-rg \
            --revision "${{ steps.pin.outputs.current }}" -o none

      - name: Tag latest
        run: |
          docker buildx imagetools create \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/fare-map:latest \
            ${{ secrets.DOCKERHUB_USERNAME }}/fare-map:${{ steps.meta.outputs.tag }}

      # CI では reporter が github だけで playwright-report/ は作られない。
      # 失敗時のトレースとスクリーンショットは test-results/ に出る
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: e2e-results-candidate
          path: test-results/
          retention-days: 7

      # 確認に落ちたら新しい版を止める。利用者は前の版のまま。時間切れや取り消しで
      # 止まった場合も同じ（failure() だけだと、そのときは走らない）。
      # Promote の後で落ちた場合（Tag latest など）は、本番はもう新しい版なので止めない。
      - name: Discard candidate
        if: (failure() || cancelled()) && steps.candidate.outputs.name != '' && steps.pin.outputs.current != ''
        run: |
          A="--name fare-map --resource-group fare-map-rg"
          SERVING=$(az containerapp revision list $A \
            --query "[?properties.trafficWeight > \`0\`].name | [0]" -o tsv)
          if [ "$SERVING" = "${{ steps.candidate.outputs.name }}" ]; then
            echo "::warning::本番は新しい版に切り替わっているので止めない"
            exit 0
          fi
          az containerapp revision label remove $A --label candidate -o none || true
          az containerapp revision deactivate $A --revision "${{ steps.candidate.outputs.name }}" -o none
          echo "::error::新しい版は確認に通らなかったので止めた。本番は $SERVING のまま"
